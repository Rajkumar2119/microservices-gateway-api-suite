name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test all services
        run: mvn -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco/"
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        module: [api-gateway, auth-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.module }} image
        run: docker build --build-arg MODULE=${{ matrix.module }} -t ${{ matrix.module }}:ci .
