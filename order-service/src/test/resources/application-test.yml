spring:
  datasource:
    url: jdbc:h2:mem:order_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cache:
    type: simple

security:
  jwt:
    secret: test-secret-for-unit-tests-only-0123456789
    issuer: http://auth-service

management:
  health:
    redis:
      enabled: false
