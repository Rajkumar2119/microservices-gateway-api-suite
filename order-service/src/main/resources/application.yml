server:
  port: ${PORT:8082}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cache:
    type: redis

orders:
  cache:
    products-ttl: PT10M

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:http://auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
