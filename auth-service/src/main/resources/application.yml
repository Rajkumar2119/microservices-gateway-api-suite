server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    # Dev-only default. Always set JWT_SECRET (32+ chars) outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:http://auth-service}
    token-ttl: ${JWT_TTL:PT30M}

bootstrap:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
